<!doctype html><html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>Dipesta Fuel Calculator</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:#f8fafc;font:16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.app{max-width:480px;margin:auto;padding:24px 18px}h1{font-size:25px;margin:8px 0 5px}.sub{color:#a8b4c7;margin:0 0 26px}label{display:block;font-size:14px;color:#cbd5e1;margin:20px 0 8px}input{width:100%;padding:17px;background:#1e293b;color:white;border:1px solid #475569;border-radius:13px;font-size:23px;outline:none}input:focus{border-color:#60a5fa}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choices button{min-height:66px;background:#1e293b;color:#e2e8f0;border:1px solid #475569;border-radius:13px;font-size:15px;font-weight:600}.choices button.active{background:#1e3a5f;border:2px solid #60a5fa;color:white}.result{background:#172c42;border:1px solid #31577d;border-radius:20px;margin-top:25px;padding:23px;text-align:center}.result .title{color:#bac9da;font-size:14px}.liters{font-size:48px;font-weight:750;letter-spacing:-1.5px;margin:9px 0}.info{color:#cbd5e1;line-height:1.7;font-size:14px}.warning{color:#fbbf24;font-size:14px;margin-top:10px;min-height:20px}.clear{width:100%;padding:15px;margin-top:20px;background:transparent;border:1px solid #64748b;color:white;border-radius:12px;font-size:16px}</style></head><body><main class="app"><h1>Dipesta Calculator</h1><p class="sub">Изчисляване на литри с отстъпка</p><label for="price">Текуща цена на колонката (€/л)</label><input id="price" type="text" inputmode="decimal" placeholder="Напр. 1,85" autocomplete="off"><label for="amount">Сума, която клиентът иска да плати (€)</label><input id="amount" type="text" inputmode="decimal" placeholder="Напр. 50" autocomplete="off"><label>Отстъпка</label><div class="choices"><button type="button" class="active" data-discount="0.05">Голяма · 0,05 €<br><small>Само дизел</small></button><button type="button" data-discount="0.03">Нормална · 0,03 €<br><small>Бензин / дизел</small></button></div><section class="result" aria-live="polite"><div class="title">ТРЯБВА ДА ЗАРЕДИШ</div><div id="liters" class="liters">— L</div><div class="info" id="details">Въведи цена и сума.</div><div id="warning" class="warning"></div></section><button type="button" class="clear" id="clear">Изчисти</button></main><script>(()=>{'use strict';const price=document.getElementById('price'),amount=document.getElementById('amount'),out=document.getElementById('liters'),details=document.getElementById('details'),warning=document.getElementById('warning'),buttons=[...document.querySelectorAll('[data-discount]')];let discount=.05;const fmt=(v,d=2)=>v.toLocaleString('bg-BG',{minimumFractionDigits:d,maximumFractionDigits:d});function parse(v){const s=v.trim().replace(/\s/g,'').replace(',','.');if(!/^\d+(\.\d+)?$/.test(s))return null;const n=Number(s);return Number.isFinite(n)?n:null}function update(){const p=parse(price.value),a=parse(amount.value);warning.textContent='';if(p===null||a===null){out.textContent='— L';details.textContent='Въведи валидна цена и сума.';return}if(p<=discount||a<=0||p>100||a>1000000){out.textContent='— L';details.textContent='Невалидни стойности.';warning.textContent='Цената трябва да е над отстъпката, а сумата положителна.';return}const discounted=p-discount;const exact=a/discounted;const l=Math.floor((exact+1e-10)*100)/100;out.textContent=fmt(l)+' L';details.innerHTML='Цена след отстъпка: <strong>'+fmt(discounted)+' €/л</strong><br>'+fmt(a)+' € ÷ '+fmt(discounted)+' €/л = '+fmt(exact,4)+' L';if(exact-l>0.000001)warning.textContent='Закръглено надолу до 0,01 L, за да не надвишава сумата.'}buttons.forEach(b=>b.addEventListener('click',()=>{discount=Number(b.dataset.discount);buttons.forEach(x=>x.classList.toggle('active',x===b));update()}));[price,amount].forEach(x=>x.addEventListener('input',update));document.getElementById('clear').addEventListener('click',()=>{price.value='';amount.value='';update();price.focus()});update()})();</script></body></html>
